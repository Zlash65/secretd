[package]
name = "secretd"
version = "0.2.3"
edition = "2024"
description = "A native local secret vault with per-request approval"
license = "MIT"
default-run = "secretd"

[lib]
name = "secretd"
path = "src/lib.rs"

[[bin]]
name = "secretd"
path = "src/bin/secretd.rs"

[dependencies]
aes-gcm = "0.11"
anyhow = "1"
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
aws-sdk-sso = "1"
aws-sdk-ssooidc = "1"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.4"
gpui-kit = "0.7.1"
pbkdf2 = "0.13"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tray-icon = "0.26"
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSResponder",
    "NSRunningApplication",
    "NSView",
    "NSWindow",
] }
raw-window-handle = "0.6"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
